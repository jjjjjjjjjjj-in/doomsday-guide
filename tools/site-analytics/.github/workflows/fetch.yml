name: アナリティクスの数字を集める
on:
  schedule:
    - cron: "7 0 * * *"   # 毎日 朝9時7分（日本時間）
  workflow_dispatch: {}   # 手動でも動かせる
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_ga.py
        env:
          GA_KEY: ${{ secrets.GA_KEY }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
      - name: 保存する
        run: |
          git config user.name "analytics-bot"
          git config user.email "noreply@anthropic.com"
          git add data
          git diff --cached --quiet || git commit -m "アナリティクスの数字 $(date -u +%F)"
          git push
